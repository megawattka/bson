name: Build distribution artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Artifacts only: no PyPI credentials or repository write access required.
permissions:
  contents: read

jobs:
  wheels:
    name: Wheel / ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            interpreter: python3.12
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            interpreter: python
          - os: macos-14
            target: aarch64-apple-darwin
            interpreter: python3.12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match project.version'"
      - name: Build release wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter }}
      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.2"
          python -m pip install --no-deps dist/*.whl
      - name: Build independent PyMongo reference
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/extract_pymongo_bson.py" --version 4.19.0
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import _p_bson; assert _p_bson.has_c()"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Verify source distribution builds
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir checked-wheels dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error