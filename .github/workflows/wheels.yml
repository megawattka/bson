name: Build wheels

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-release
  cancel-in-progress: false

jobs:
  wheels:
    name: Wheel / ${{ matrix.platform.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        platform:
          -   os: ubuntu-24.04
              target: x86_64-unknown-linux-gnu
          -   os: ubuntu-24.04-arm
              target: aarch64-unknown-linux-gnu
          -   os: windows-2022
              target: x86_64-pc-windows-msvc
          -   os: macos-15
              target: aarch64-apple-darwin
          -   os: macos-15-intel
              target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      -   uses: actions/checkout@v4
      -   uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python }}
      -   name: Build release wheel
          uses: PyO3/maturin-action@v1
          with:
            command: build
            target: ${{ matrix.platform.target }}
            manylinux: "2_28"
            args: --release --out dist --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
      -   uses: actions/upload-artifact@v4
          with:
            name: wheel-${{ matrix.platform.target }}-${{ matrix.python }}
            path: dist/*.whl
            if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      -   uses: actions/checkout@v4
      -   uses: actions/setup-python@v5
          with:
            python-version: "3.12"
      -   name: Build source distribution
          uses: PyO3/maturin-action@v1
          with:
            command: sdist
            args: --out dist
      -   uses: actions/upload-artifact@v4
          with:
            name: source-distribution
            path: dist/*.tar.gz
            if-no-files-found: error

  publish:
    name: Upload to python.wattka.dev
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: main
    steps:
      -   uses: astral-sh/setup-uv@v6
      -   uses: actions/download-artifact@v4
          with:
            path: dist
            merge-multiple: true
      -   name: Upload distributions
          env:
            UV_PUBLISH_TOKEN: ${{ secrets.PACKAGE_INDEX_TOKEN }}
          run: uv publish --publish-url https://python.wattka.dev/ --trusted-publishing never dist/*