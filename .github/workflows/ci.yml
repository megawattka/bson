name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-tests:
    name: Lint and type-check annotated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools and native package
        run: |
          python -m pip install "ruff>=0.17.1" "pyright>=1.1.414"
          python -m pip install .
      - name: Build independent PyMongo reference
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/extract_pymongo_bson.py" --version 4.19.0
      # Other files are not yet a verified lint/type-check baseline.
      - name: Check annotated test modules
        run: |
          python -m ruff check --config pyproject.toml tests/test_decode.py tests/test_encode.py tests/test_remaining_types.py
          python -m pyright tests/test_decode.py tests/test_encode.py tests/test_remaining_types.py

  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build and install release wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.15,<2" "pytest>=9.2"
          python -m maturin build --release --out dist
          python -m pip install --no-deps dist/*.whl
      - name: Build independent PyMongo reference
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/extract_pymongo_bson.py" --version 4.19.0
      - name: Verify installed native modules
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import bson, _p_bson; from bson import _bson; assert _p_bson.has_c(); assert bson.InvalidBSON is not _p_bson.InvalidBSON; print(_bson.__file__)"
      - name: Run full test suite against installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q